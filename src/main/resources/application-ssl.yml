server:
  port: 8443
  http2:
    enabled: true
  compression:
    enabled: true
    min-response-size: 2048
    mime-types: application/hal+json,application/json,application/xml,text/html,text/xml,text/plain,image/png,image/jpeg,image/gif
  servlet:
    session:
      timeout: 10s
  ssl:
    certificate: /ssl/cert.crt
    certificate-private-key: /ssl/cert.key
spring:
  web:
    error:
      whitelabel:
        enabled: false
